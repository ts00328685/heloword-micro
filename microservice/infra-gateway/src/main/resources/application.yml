server:
  port: 9487

spring:
  application:
    name: infra-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    registry-fetch-interval-seconds: 5

logging:
  level:
    com.springframework.*: debug
    com.heloword.*: debug
