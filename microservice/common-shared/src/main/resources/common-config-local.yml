eureka:
  instance:
    prefer-ip-address: false
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true

cipher:
  aes:
    key: ${AES_KEY}
    iv: ${AES_IV}

feign:
  api-key: ${FEIGN_API_KEY}
  client:
    config:
      default:
        connectTimeout: 20000
        readTimeout: 120000

spring:

  security:
    filter:
      order: 10

  datasource:
    url: ${HELO_DB_URL}
    username: ${HELO_DB_USERNAME}
    password: ${HELO_DB_PASSWORD}
    hikari:
      # The server default charset is utf8 (3-byte), so a connection that
      # negotiates it silently rejects 4-byte characters — every emoji outside
      # the BMP. Pin the session to utf8mb4 on each pooled connection.
      connection-init-sql: SET NAMES utf8mb4

  redis:
    host: ${HELO_REDIS_URL}
    password: ${HELO_REDIS_PASSWORD}
    port: ${HELO_REDIS_PORT}

  jpa:
    show-sql: true
    hibernate:
      dialect: org.hibernate.dialect.MySQL55Dialect
      ddl-auto: update

  zipkin:
    # default false for local env
    enabled: false
    base-url: http://localhost:9411
