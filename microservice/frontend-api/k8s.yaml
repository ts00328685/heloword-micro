apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ${APP_NAME}
  name: ${APP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APP_NAME}
  strategy: {}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
      - image: ts00328685/heloword-${APP_NAME}:${MAJOR_VERSION}.${MINOR_VERSION}
        name: ${APP_NAME}
        resources: {}
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 7001
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 7001
          initialDelaySeconds: 90
          periodSeconds: 30
          failureThreshold: 3
        env:
          - name: TZ
            value: Asia/Taipei
          - name: HELO_LLM_URL
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_LLM_URL
          - name: HELO_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_DB_USERNAME
          - name: HELO_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_DB_PASSWORD
          - name: HELO_DB_URL
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_DB_URL
          - name: HELO_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_REDIS_URL
          - name: HELO_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_REDIS_PASSWORD
          - name: HELO_REDIS_PORT
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: HELO_REDIS_PORT
          - name: AES_KEY
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: AES_KEY
          - name: AES_IV
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: AES_IV
          - name: FEIGN_API_KEY
            valueFrom:
              secretKeyRef:
                name: heloword-secret
                key: FEIGN_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ${APP_NAME}
  name: ${APP_NAME}
spec:
  ports:
  - port: 7001
    protocol: TCP
    targetPort: 7001
  selector:
    app: ${APP_NAME}
status:
  loadBalancer: {}
---
# Direct WebSocket ingress — bypasses the gateway (browsers cannot send custom
# headers on WS upgrade, so the gateway AuthFilter would reject it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/fe/ws
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  name: ${APP_NAME}-ws
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - backend:
              service:
                name: ${APP_NAME}
                port:
                  number: 7001
            path: /${APP_NAME}/v${MAJOR_VERSION}/fe/ws
            pathType: Prefix
